name: Check project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: roadster2-moon-cloudbase/.node-version
          cache: npm
          cache-dependency-path: roadster2-moon-cloudbase/package-lock.json
      - run: npm ci
        working-directory: roadster2-moon-cloudbase
      - run: node tests/run.js
      - run: npm run build
        working-directory: roadster2-moon-cloudbase
      - run: node scripts/check-assets.mjs --built
